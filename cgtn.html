<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CGTN 视频链接提取器</title>
    <style>
        /* 基础样式重置与优化 */
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .container {
            background-color: #fff;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 30px;
        }
        
        /* 输入区域：改为 Flex 布局，方便移动端折叠 */
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 14px 15px; /* 增加高度，提升触摸体验 */
            font-size: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: #3498db;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }
        button.primary-btn {
            padding: 14px 24px;
            font-size: 15px;
            font-weight: 500;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
            white-space: nowrap;
        }
        button.primary-btn:hover { background-color: #2980b9; }
        button.primary-btn:disabled { background-color: #bdc3c7; cursor: not-allowed; }

        /* 结果与错误提示区 */
        .result-box {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background-color: #f8fdfb;
            border: 1px solid #1abc9c;
            border-radius: 8px;
        }
        .error-box {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background-color: #fff5f5;
            border: 1px solid #ff7675;
            border-radius: 8px;
            color: #d63031;
            font-size: 14px;
        }
        .video-url {
            word-break: break-all;
            background: #fff;
            padding: 12px;
            border: 1px dashed #1abc9c;
            border-radius: 6px;
            margin-bottom: 15px;
            font-family: monospace;
            color: #2d3436;
            font-size: 13px;
        }

        /* 底部操作按钮 */
        .action-btns {
            display: flex;
            gap: 10px; /* 使用 gap 代替 margin，移动端更灵活 */
        }
        .action-btns button {
            flex: 1; /* 让按钮平分宽度 */
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
        }
        .action-btns button.copy { background-color: #00b894; }
        .action-btns button.copy:hover { background-color: #00cec9; }
        .action-btns button.open { background-color: #0984e3; }
        .action-btns button.open:hover { background-color: #74b9ff; }
        
        video {
            width: 100%;
            border-radius: 8px;
            background: #000;
            margin-top: 15px;
            outline: none;
        }
        .loader {
            display: none;
            text-align: center;
            margin: 15px 0;
            color: #636e72;
            font-size: 14px;
        }

        /* 自定义 Toast 提示框 (替代原生的 alert) */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 12px 20px;
            position: fixed;
            z-index: 1000;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s, bottom 0.3s;
        }
        #toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 50px;
        }

        /* 📱 移动端专项优化 (针对屏幕宽度小于 600px 的设备) */
        @media (max-width: 600px) {
            body {
                margin: 0;
                padding: 15px; /* 减小外边距 */
                background-color: #fff; /* 手机端全白背景更沉浸 */
            }
            .container {
                padding: 20px 15px; /* 减小内边距，给内容留出更多空间 */
                box-shadow: none; /* 移除手机端多余的阴影 */
            }
            h1 {
                font-size: 20px;
                margin-bottom: 20px;
            }
            .input-group {
                flex-direction: column; /* 手机端将输入框和按钮上下排列 */
            }
            button.primary-btn {
                width: 100%; /* 按钮占满全宽 */
            }
            .action-btns {
                flex-direction: column; /* 复制和打开按钮上下排列防误触 */
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>CGTN 视频提取器</h1>
    
    <div class="input-group">
        <input type="text" id="urlInput" placeholder="输入网页链接 (例如: https://news.cgtn.com/.../p.html)" autocomplete="off">
        <button id="extractBtn" class="primary-btn" onclick="extractVideo()">提取视频</button>
    </div>

    <div class="loader" id="loader">⏳ 正在深入解析网页核心数据，请稍候...</div>

    <div class="result-box" id="resultBox">
        <h3 style="margin-top:0; color: #00b894; font-size: 18px;">🎉 提取成功！</h3>
        <p style="font-size: 14px; color: #636e72; margin-bottom: 8px;"><strong>转换后的 MP4 直链：</strong></p>
        <div class="video-url" id="videoUrlText"></div>
        
        <div class="action-btns">
            <button class="copy" onclick="copyToClipboard()">复制链接</button>
            <button class="open" onclick="window.open(document.getElementById('videoUrlText').innerText, '_blank')">在新标签打开</button>
        </div>
        
        <p style="margin-top: 25px; margin-bottom: 8px; font-size: 14px; color: #636e72;"><strong>视频预览：</strong></p>
        <video id="videoPlayer" controls playsinline></video>
    </div>

    <div class="error-box" id="errorBox"></div>
</div>

<!-- 自定义提示框 -->
<div id="toast"></div>

<script>
    async function fetchHtmlWithFallback(url) {
        const proxies = [
            `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
            `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
            `https://corsproxy.io/?${encodeURIComponent(url)}`
        ];

        for (let i = 0; i < proxies.length; i++) {
            try {
                const response = await fetch(proxies[i]);
                if (response.ok) {
                    return await response.text();
                }
            } catch (error) {
                console.warn(`代理节点 ${i + 1} 失败，切换中...`);
            }
        }
        throw new Error("网络请求失败，请检查网址或网络环境。");
    }

    async function extractVideo() {
        const urlInput = document.getElementById('urlInput').value.trim();
        const extractBtn = document.getElementById('extractBtn');
        const loader = document.getElementById('loader');
        const resultBox = document.getElementById('resultBox');
        const errorBox = document.getElementById('errorBox');
        const videoPlayer = document.getElementById('videoPlayer');

        resultBox.style.display = 'none';
        errorBox.style.display = 'none';
        videoPlayer.src = '';
        
        if (!urlInput) {
            showToast("网址不能为空！");
            return;
        }

        // 手机端收起软键盘
        document.getElementById('urlInput').blur();

        extractBtn.disabled = true;
        loader.style.display = 'block';

        try {
            const htmlString = await fetchHtmlWithFallback(urlInput);
            
            let rawUrl = '';
            const contentUrlMatch = htmlString.match(/"contentUrl"\s*:\s*"([^"]+)"/i);
            const dataVideoMatch = htmlString.match(/data-video\s*=\s*["']([^"']+)["']/i);
            const posterMatch = htmlString.match(/https:\/\/video\.cgtn\.com\/[^"'\s<>]+\.jpg/i);

            if (contentUrlMatch && contentUrlMatch[1].includes('video.cgtn.com')) {
                rawUrl = contentUrlMatch[1];
            } else if (dataVideoMatch && dataVideoMatch[1].includes('video.cgtn.com')) {
                rawUrl = dataVideoMatch[1];
            } else if (posterMatch && posterMatch[0]) {
                rawUrl = posterMatch[0];
            }

            if (rawUrl) {
                const mp4Url = rawUrl.replace(/\.(m3u8|jpg|jpeg|png)$/i, '.mp4');
                document.getElementById('videoUrlText').innerText = mp4Url;
                videoPlayer.src = mp4Url;
                resultBox.style.display = 'block';
                
                // 平滑滚动到结果区域
                setTimeout(() => resultBox.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
            } else {
                showError("未能定位到该网页的主视频。");
            }

        } catch (error) {
            showError(`提取出错：${error.message}`);
        } finally {
            extractBtn.disabled = false;
            loader.style.display = 'none';
        }
    }

    function showError(message) {
        const errorBox = document.getElementById('errorBox');
        errorBox.innerText = message;
        errorBox.style.display = 'block';
    }

    function copyToClipboard() {
        const text = document.getElementById('videoUrlText').innerText;
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => {
                showToast("✅ 链接已复制到剪贴板！");
            }).catch(err => {
                showToast("❌ 复制失败，请手动长按复制。");
            });
        } else {
            // 兼容老版本浏览器
            const tempInput = document.createElement("input");
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);
            showToast("✅ 链接已复制到剪贴板！");
        }
    }

    // 优雅的 Toast 提示框，替代生硬的 alert()
    let toastTimeout;
    function showToast(message) {
        const toast = document.getElementById("toast");
        toast.innerText = message;
        toast.className = "show";
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(function(){ toast.className = toast.className.replace("show", ""); }, 3000);
    }
</script>

</body>
</html>
