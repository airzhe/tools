    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #f5f6f8;
            color: #1e293b;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 顶部工具栏（对语音引擎隐形） */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            user-select: none;
            speak: none !important;
        }

        .lang-indicator {
            font-size: 13px;
            color: #64748b;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .lang-indicator::before {
            content: "";
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #94a3b8;
            transition: background-color 0.2s ease;
        }

        .lang-zh::before { background-color: #3b82f6 !important; } 
        .lang-ja::before { background-color: #ef4444 !important; } 
        .lang-en::before { background-color: #10b981 !important; } 

        .btn-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-tool {
            border: none;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 500;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap; 
        }

        .btn-import {
            background-color: #e0f2fe;
            color: #0369a1;
        }
        .btn-import:active {
            background-color: #bae6fd;
        }

        .btn-search {
            background-color: #f0fdf4;
            color: #15803d;
        }
        .btn-search:active {
            background-color: #dcfce7;
        }

        .btn-clear {
            background-color: #e2e8f0;
            color: #475569;
        }
        .btn-clear:active {
            background-color: #cbd5e1;
        }

        /* 优雅的内置搜索栏（对语音引擎隐形） */
        .search-bar {
            display: flex;
            gap: 8px;
            background-color: #ffffff;
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            animation: slideDown 0.2s ease-out;
            speak: none !important;
        }

        .search-bar input {
            flex: 1;
            border: none;
            background: transparent;
            color: #1e293b;
            outline: none;
            font-size: 14px;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 悬浮返回顶部（对语音引擎隐形） */
        .btn-to-top {
            position: fixed;
            bottom: 32px;
            right: 24px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.95);
            color: #1e293b;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
            cursor: pointer;
            display: none; 
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            z-index: 999;
            transition: all 0.2s ease;
            user-select: none;
            speak: none !important;
        }
        .btn-to-top:active {
            transform: scale(0.9);
        }

        /* 历史段落折叠/加载提示条（对语音引擎隐形） */
        .unfold-banner {
            background-color: #ffffff;
            color: #475569;
            opacity: 0.85;
            padding: 12px;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            border-radius: 12px;
            margin-bottom: 4px;
            cursor: pointer;
            border: 1px dashed #cbd5e1;
            box-sizing: border-box;
            user-select: none;
            speak: none !important;
            transition: background-color 0.2s;
        }
        .unfold-banner:hover {
            background-color: #f8fafc;
        }

        /* 被折叠的已读段落 */
        .read-folded {
            display: none !important; 
        }

        /* 实体书页排版 */
        .book-page {
            width: 100%;
            min-height: 75vh;
            padding: 32px 24px;
            font-size: 18.5px;
            line-height: 2.0; 
            color: #1e293b;
            background-color: #ffffff;
            border: 1px solid #e2e8f0;

        .book-page p {
            margin: 0 0 1.4em 0;
            text-indent: 2em;      
            line-height: 2.0;
        }

        .book-page:empty::before {
            content: attr(placeholder);
            color: #94a3b8;
        }

        /* 手机端自适应微调 */
        @media screen and (max-width: 768px) {
            body {
                padding: 12px;
            }

            .toolbar {
                padding: 4px 0; 
            }

            .btn-tool {
                font-size: 12px; 
                padding: 6px 12px;   
            }

            .book-page {
                padding: 24px 16px;     
                font-size: 17.5px;         
                border-radius: 12px;       
            }

            .btn-to-top {
                bottom: 24px;
                right: 16px; 
            }
        }
    </style>

<body>

    <div class="container">
        <!-- 顶部主工具栏（对语音引擎隐藏） -->
        <div class="toolbar" aria-hidden="true" role="none" tabindex="-1">
            <div id="lang-indicator" class="lang-indicator">--</div>
            <div class="btn-group">
                <input type="file" id="txt-file-input" accept=".txt" style="display: none;" tabindex="-1" />
                <button class="btn-tool btn-import" onclick="triggerImport()" tabindex="-1">导入</button>
                <button class="btn-tool btn-search" onclick="toggleSearchBar()" tabindex="-1">搜索</button>
                <button class="btn-tool btn-clear" onclick="clearText()" tabindex="-1">清空</button>
            </div>
        </div>

        <!-- 内置搜索栏（对语音引擎隐藏） -->
        <div id="search-bar" class="search-bar" style="display: none;" aria-hidden="true" role="none" tabindex="-1">
            <input type="text" id="search-input" placeholder="输入已听过的字句定位段落..." onkeydown="handleSearchKeyDown(event)" tabindex="-1" />
            <button class="btn-tool btn-search" onclick="performSearch()" tabindex="-1">定位</button>
        </div>
        
        <!-- 文章容器 -->
        <div id="read-target" class="book-page" contenteditable="plaintext-only" role="main" aria-label="小说正文" placeholder="请在此粘贴文字，或点击上方按钮导入 TXT 文件..." autofocus></div>
    </div>

    <!-- 悬浮返回顶部按钮（对语音引擎隐藏） -->
    <button id="btn-to-top" class="btn-to-top" onclick="scrollToTop()" title="返回顶部" aria-hidden="true" role="none" tabindex="-1">↑</button>

    <script>
        const page = document.getElementById('read-target');
        const fileInput = document.getElementById('txt-file-input');
        const htmlRoot = document.getElementById('html-root');
        const langIndicator = document.getElementById('lang-indicator');
        const toTopBtn = document.getElementById('btn-to-top');
        const searchBar = document.getElementById('search-bar');
        const searchInput = document.getElementById('search-input');
        
        const storageKey = 'reader_cached_text';
        const paragraphKey = 'reader_cached_paragraph'; 

        // 【激进高承载方案参数】
        const THRESHOLD_LARGE_FILE = 1500; // 超过 1500 段才视为大文件，绝大多数文件直接 100% 全量加载
        const INITIAL_CHUNK_SIZE = 1000;   // 分片模式下：初始载入 1000 段，大幅降低滑动时的分片感
        const APPEND_CHUNK_SIZE = 500;     // 触底追加 500 段，提升极速滑动时的流畅度
        
        // 【模糊安全余量（用于非主动触发的载入）】
        const PROGRESS_SAFETY_MARGIN = 3; 

        let allParagraphs = [];           // 内存数组
        let isSliceMode = false;          // 是否激活分片模式
        let renderedStart = 0;            // 当前 DOM 首段索引
        let renderedEnd = 0;              // 当前 DOM 末段索引

        let isScrollPending = false;      // 滚动节流锁
        let programmaticScrollLock = false;// 页面自动跳转锁定（防误判）
        let lastScrollY = window.scrollY; // 记录上一次的滚动位置，用以判定滚动方向

        // 听书文本净化器
        function sanitizeTextForTTS(text) {
            return text
                .replace(/[-*#=_~+◆★▲●▼■]{3,}/g, '') 
                .replace(/\s+/g, ' '); 
        }

        // 格式化文本并判定加载策略
        function formatTextToParagraphs(text) {
            if (!text || text.trim() === "") {
                allParagraphs = [];
                page.innerHTML = '';
                page.contentEditable = "plaintext-only";
                isSliceMode = false;
                removeBanners();
                return;
            }

            allParagraphs = text.split(/\r?\n/)
                .map(line => sanitizeTextForTTS(line.trim()))
                .filter(line => line.length > 0);

            const totalCount = allParagraphs.length;

            if (totalCount <= THRESHOLD_LARGE_FILE) {
                // 【全量模式】
                isSliceMode = false;
                page.contentEditable = "plaintext-only"; 
                removeBanners();
                page.innerHTML = allParagraphs.map((line, idx) => `<p data-idx="${idx}">${line}</p>`).join('');
            } else {
                // 【分片模式】
                isSliceMode = true;
                page.contentEditable = "false"; 
                
                let savedIndex = parseInt(localStorage.getItem(paragraphKey)) || 0;
                if (savedIndex >= totalCount) savedIndex = 0;

                // 正常初始化重载时：前置 3 段安全缓冲区
                renderedStart = Math.max(0, savedIndex - PROGRESS_SAFETY_MARGIN); 
                renderedEnd = Math.min(totalCount - 1, renderedStart + INITIAL_CHUNK_SIZE);

                renderSlice();
            }
        }

        // 渲染分片片段
        function renderSlice() {
            removeBanners();

            const docFrag = document.createDocumentFragment();

            if (renderedStart > 0) {
                const banner = document.createElement('div');
                banner.id = 'unfold-banner';
                banner.className = 'unfold-banner';
                banner.textContent = `上方已折叠 ${renderedStart} 个段落，点击加载更早内容...`;
                banner.onclick = loadEarlierParagraphs;
                docFrag.appendChild(banner);
            }

            for (let i = renderedStart; i <= renderedEnd; i++) {
                const p = document.createElement('p');
                p.setAttribute('data-idx', i);
                p.textContent = allParagraphs[i];
                docFrag.appendChild(p);
            }

            page.innerHTML = '';
            page.appendChild(docFrag);
        }

        // 动态触底加载
        function loadMoreParagraphs() {
            if (renderedEnd >= allParagraphs.length - 1) return;

            const nextEnd = Math.min(allParagraphs.length - 1, renderedEnd + APPEND_CHUNK_SIZE);
            const fragment = document.createDocumentFragment();

            for (let i = renderedEnd + 1; i <= nextEnd; i++) {
                const p = document.createElement('p');
                p.setAttribute('data-idx', i);
                p.textContent = allParagraphs[i];
                fragment.appendChild(p);
            }

            page.appendChild(fragment);
            renderedEnd = nextEnd;
        }

        // 动态加载上方内容
        function loadEarlierParagraphs() {
            const previousStart = renderedStart;
            renderedStart = Math.max(0, renderedStart - APPEND_CHUNK_SIZE);

            const referenceNode = page.querySelector(`p[data-idx="${previousStart}"]`);
            const prevOffset = referenceNode ? referenceNode.getBoundingClientRect().top : 0;

            programmaticScrollLock = true;
            renderSlice();

            if (referenceNode) {
                const nextNode = page.querySelector(`p[data-idx="${previousStart}"]`);
                if (nextNode) {
                    const postOffset = nextNode.getBoundingClientRect().top;
                    window.scrollBy(0, postOffset - prevOffset);
                }
            }
            setTimeout(() => { programmaticScrollLock = false; }, 100);
        }

        // 清理现存提示条
        function removeBanners() {
            const banner = document.getElementById('unfold-banner');
            if (banner) banner.remove();
        }

        // 语言自动检测
        function autoDetectLanguage(text) {
            if (!text || text.trim() === "") {
                htmlRoot.setAttribute('lang', 'zh-CN');
                langIndicator.textContent = "--";
                langIndicator.className = "lang-indicator";
                return;
            }
            
            const hasJapaneseKana = /[\u3040-\u309F\u30A0-\u30FF]/.test(text);
            if (hasJapaneseKana) {
                htmlRoot.setAttribute('lang', 'ja-JP');
                langIndicator.textContent = "JA";
                langIndicator.className = "lang-indicator lang-ja";
                return;
            }

            const hasChinese = /[\u4e00-\u9fa5]/.test(text);
            if (hasChinese) {
                htmlRoot.setAttribute('lang', 'zh-CN');
                langIndicator.textContent = "ZH";
                langIndicator.className = "lang-indicator lang-zh";
                return;
            }

            htmlRoot.setAttribute('lang', 'en-US');
            langIndicator.textContent = "EN";
            langIndicator.className = "lang-indicator lang-en";
        }

        // 实时阅读进度监控
        function trackScrollProgressRealtime(scrollingUp) {
            // 如果是在向上滚动、自动跳转锁或正在处理滚动中，则直接忽略，不改变 offset 值
            if (isScrollPending || programmaticScrollLock || scrollingUp) return;
            isScrollPending = true;

            requestAnimationFrame(() => {
                const paragraphs = page.querySelectorAll('p');
                if (paragraphs.length === 0) {
                    isScrollPending = false;
                    return;
                }

                const targetLineY = window.innerHeight * 0.3; 
                let activeIndex = -1;
                let closestDistance = Infinity;

                for (let i = 0; i < paragraphs.length; i++) {
                    const p = paragraphs[i];
                    if (p.classList.contains('read-folded')) continue;

                    const rect = p.getBoundingClientRect();
                    
                    if (rect.top <= targetLineY && rect.bottom >= targetLineY) {
                        const idxStr = p.getAttribute('data-idx');
                        if (idxStr !== null) {
                            activeIndex = parseInt(idxStr);
                            break; 
                        }
                    }

                    const distance = Math.abs(rect.top - targetLineY);
                    if (distance < closestDistance) {
                        closestDistance = distance;
                        const idxStr = p.getAttribute('data-idx');
                        if (idxStr !== null) {
                            activeIndex = parseInt(idxStr);
                        }
                    }
                }

                if (activeIndex !== -1) {
                    const savedIndexStr = localStorage.getItem(paragraphKey);
                    const savedIndex = savedIndexStr ? parseInt(savedIndexStr) : 0;
                    // 仅当新计算的段落索引大于当前已保存的索引时才更新，确保进度单向递增，向上滚动时不退回
                    if (activeIndex > savedIndex) {
                        localStorage.setItem(paragraphKey, activeIndex);
                    }
                }

                isScrollPending = false;
            });
        }

        // 恢复阅读进度（日常载入，保留安全缓冲余量）
        function restoreReadingProgress() {
            const savedIndexStr = localStorage.getItem(paragraphKey);
            if (!savedIndexStr) return;
            const savedIndex = parseInt(savedIndexStr);

            programmaticScrollLock = true; 

            const safeStartIndex = Math.max(0, savedIndex - PROGRESS_SAFETY_MARGIN);

            if (isSliceMode) {
                if (savedIndex >= 0 && savedIndex < allParagraphs.length) {
                    if (savedIndex < renderedStart || savedIndex > renderedEnd) {
                        renderedStart = safeStartIndex;
                        renderedEnd = Math.min(allParagraphs.length - 1, renderedStart + INITIAL_CHUNK_SIZE);
                        renderSlice();
                    }

                    setTimeout(() => {
                        const targetP = page.querySelector(`p[data-idx="${safeStartIndex}"]`);
                        if (targetP) {
                            targetP.scrollIntoView({ block: 'start', behavior: 'instant' });
                            window.scrollBy(0, -15);
                        }
                        programmaticScrollLock = false;
                    }, 150);
                } else {
                    programmaticScrollLock = false;
                }
            } else {
                const paragraphs = page.querySelectorAll('p');
                if (safeStartIndex > 0 && safeStartIndex < paragraphs.length) {
                    const banner = document.createElement('div');
                    banner.id = 'unfold-banner';
                    banner.className = 'unfold-banner';
                    banner.setAttribute('aria-hidden', 'true');
                    banner.setAttribute('role', 'none');
                    banner.setAttribute('tabindex', '-1');
                    banner.textContent = `已自动折叠上方 ${safeStartIndex} 个已读段落，点击展开...`;
                    banner.onclick = unfoldAllParagraphs;

                    const container = document.querySelector('.container');
                    container.insertBefore(banner, page);

                    for (let i = 0; i < safeStartIndex; i++) {
                        paragraphs[i].classList.add('read-folded');
                    }

                    const targetP = paragraphs[safeStartIndex];
                    setTimeout(() => {
                        targetP.scrollIntoView({ block: 'start', behavior: 'instant' });
                        window.scrollTo(0, 0); 
                        programmaticScrollLock = false;
                    }, 100);
                } else {
                    programmaticScrollLock = false;
                }
            }
        }

        // 重置进度
        function resetProgress() {
            localStorage.setItem(paragraphKey, 0);
            silentResetFolding();
        }

        // 监听页面滚动
        window.addEventListener('scroll', function() {
            const currentScrollY = window.scrollY;
            // 判定当前滚动动作是否为“向上滚动”
            const scrollingUp = currentScrollY < lastScrollY;
            lastScrollY = currentScrollY;

            if (currentScrollY > 400) {
                toTopBtn.style.display = 'flex';
            } else {
                toTopBtn.style.display = 'none';
            }

            // 传入滚动方向判断值
            trackScrollProgressRealtime(scrollingUp);

            if (isSliceMode) {
                if (window.innerHeight + currentScrollY >= document.documentElement.scrollHeight - 600) {
                    loadMoreParagraphs();
                }
            }
        });

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function silentResetFolding() {
            const paragraphs = page.querySelectorAll('p');
            paragraphs.forEach(p => p.classList.remove('read-folded'));
            removeBanners();
        }

        function unfoldAllParagraphs() {
            if (isSliceMode) return;
            
            programmaticScrollLock = true;
            silentResetFolding();
            
            const savedIndexStr = localStorage.getItem(paragraphKey);
            const paragraphs = page.querySelectorAll('p');
            if (savedIndexStr && paragraphs[parseInt(savedIndexStr)]) {
                const targetP = paragraphs[parseInt(savedIndexStr)];
                targetP.scrollIntoView({ block: 'start', behavior: 'instant' });
                window.scrollBy(0, -50);
            }
            setTimeout(() => { programmaticScrollLock = false; }, 200);
        }

        // 搜索面板控制
        function toggleSearchBar() {
            if (searchBar.style.display === 'none') {
                searchBar.style.display = 'flex';
                searchInput.focus();
            } else {
                searchBar.style.display = 'none';
            }
        }

        function handleSearchKeyDown(e) {
            if (e.key === 'Enter') {
                performSearch();
            }
        }

        // 【高精准度搜索重构】
        function performSearch() {
            const query = searchInput.value;
            if (!query || query.trim() === "") return;

            let foundIndex = -1;

            if (isSliceMode) {
                for (let i = 0; i < allParagraphs.length; i++) {
                    if (allParagraphs[i].includes(query.trim())) {
                        foundIndex = i;
                        break; 
                    }
                }
            } else {
                const paragraphs = page.querySelectorAll('p');
                for (let i = 0; i < paragraphs.length; i++) {
                    if (paragraphs[i].textContent.includes(query.trim())) {
                        foundIndex = i;
                        break; 
                    }
                }
            }

            if (foundIndex !== -1) {
                programmaticScrollLock = true;
                localStorage.setItem(paragraphKey, foundIndex); // 记录精确的位置

                if (isSliceMode) {
                    // 【大文件模式】绕过安全余量，将 foundIndex 作为切片起点渲染，使其精确对齐在首行
                    renderedStart = foundIndex;
                    renderedEnd = Math.min(allParagraphs.length - 1, renderedStart + INITIAL_CHUNK_SIZE);
                    renderSlice();
                    window.scrollTo({ top: 0, behavior: 'instant' });
                } else {
                    // 【小文件模式】绕过安全余量，精确折叠 foundIndex 之前的所有元素
                    silentResetFolding();
                    
                    const paragraphs = page.querySelectorAll('p');
                    if (foundIndex > 0 && foundIndex < paragraphs.length) {
                        const banner = document.createElement('div');
                        banner.id = 'unfold-banner';
                        banner.className = 'unfold-banner';
                        banner.setAttribute('aria-hidden', 'true');
                        banner.setAttribute('role', 'none');
                        banner.setAttribute('tabindex', '-1');
                        banner.textContent = `已自动折叠上方 ${foundIndex} 个已读段落，点击展开...`;
                        banner.onclick = unfoldAllParagraphs;

                        const container = document.querySelector('.container');
                        container.insertBefore(banner, page);

                        for (let i = 0; i < foundIndex; i++) {
                            paragraphs[i].classList.add('read-folded');
                        }
                    }
                }

                // 精确滚动对齐
                setTimeout(() => {
                    const targetP = page.querySelector(`p[data-idx="${foundIndex}"]`);
                    if (targetP) {
                        targetP.scrollIntoView({ block: 'start', behavior: 'smooth' });
                    }
                    programmaticScrollLock = false;
                }, 150);

                toggleSearchBar();
            } else {
                alert("未在正文中找到包含该字句的段落。");
            }
        }

        // 粘贴文本
        page.addEventListener('paste', function(e) {
            e.preventDefault();
            const text = (e.clipboardData || window.clipboardData).getData('text/plain');
            
            resetProgress(); 
            localStorage.setItem(storageKey, text);
            formatTextToParagraphs(text);
            autoDetectLanguage(text);
        });

        // 文本输入
        page.addEventListener('input', function() {
            if (isSliceMode) return;
            const rawText = page.innerText;
            localStorage.setItem(storageKey, rawText);
            autoDetectLanguage(rawText);
        });

        // 导入 TXT（支持编码自动检测）
        function triggerImport() {
            fileInput.click();
        }

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const buffer = evt.target.result;
                const uint8 = new Uint8Array(buffer);
                
                let isUtf8 = true;
                let i = 0;
                while (i < uint8.length) {
                    if (uint8[i] <= 0x7F) { i++; }
                    else if (uint8[i] >= 0xC2 && uint8[i] <= 0xDF && i + 1 < uint8.length && (uint8[i+1] & 0xC0) === 0x80) { i += 2; }
                    else if (uint8[i] >= 0xE0 && uint8[i] <= 0xEF && i + 2 < uint8.length && (uint8[i+1] & 0xC0) === 0x80 && (uint8[i+2] & 0xC0) === 0x80) { i += 3; }
                    else { isUtf8 = false; break; }
                }

                const encoding = isUtf8 ? 'utf-8' : 'gbk';
                const decoder = new TextDecoder(encoding);
                const textContent = decoder.decode(uint8);

                resetProgress(); 
                formatTextToParagraphs(textContent);               
                localStorage.setItem(storageKey, textContent); 
                autoDetectLanguage(textContent);
                fileInput.value = '';                         
                page.focus();
            };
            
            reader.readAsArrayBuffer(file);
        });

        // 清空
        function clearText() {
            if (confirm("确定要清空所有文本和听书进度吗？")) {
                page.innerHTML = '';
                allParagraphs = [];
                isSliceMode = false;
                page.contentEditable = "plaintext-only";
                localStorage.removeItem(storageKey);
                localStorage.removeItem(paragraphKey);
                fileInput.value = '';
                autoDetectLanguage('');
                removeBanners();
                page.focus();
            }
        }

        // 初始化
        window.addEventListener('DOMContentLoaded', function() {
            const cachedRawText = localStorage.getItem(storageKey);
            if (cachedRawText) {
                formatTextToParagraphs(cachedRawText);
                autoDetectLanguage(cachedRawText);
                restoreReadingProgress(); 
            } else {
                autoDetectLanguage('');
            }
        });
    </script>
</body>
</html>
