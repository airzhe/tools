<!DOCTYPE html>
<html id="html-root" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>纯净听书中转站 (多语指示版)</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #f5f6f8;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 顶部工具栏：左侧对齐状态，右侧对齐按钮 */
        .toolbar {
            display: flex;
            justify-content: space-between; /* 左右两端对齐 */
            align-items: center;
            width: 100%;
            -webkit-user-select: none;
            user-select: none;
            speak: none !important;
        }

        /* 极简状态指示器样式 */
        .lang-indicator {
            font-size: 13px;
            color: #64748b;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        /* 状态指示器前的彩色小圆点 */
        .lang-indicator::before {
            content: "";
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #94a3b8; /* 默认灰色 */
            transition: background-color 0.2s ease;
        }

        /* 三语状态灯色彩 */
        .lang-zh::before { background-color: #3b82f6 !important; } /* 中文：蓝色 */
        .lang-ja::before { background-color: #ef4444 !important; } /* 日语：红色 */
        .lang-en::before { background-color: #10b981 !important; } /* 英文：绿色 */

        /* 按钮容器 */
        .btn-group {
            display: flex;
            gap: 8px;
        }

        /* 基础按钮 */
        .btn-tool {
            border: none;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 500;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        /* “导入 TXT”按钮：莫兰迪优雅蓝色 */
        .btn-import {
            background-color: #e0f2fe;
            color: #0369a1;
        }
        .btn-import:active {
            background-color: #bae6fd;
        }

        /* “清空文字”按钮：质感暖灰色 */
        .btn-clear {
            background-color: #e2e8f0;
            color: #475569;
        }
        .btn-clear:active {
            background-color: #cbd5e1;
        }

        /* 实体书页质感排版 */
        .book-page {
            width: 100%;
            min-height: 80vh;
            padding: 32px 24px;
            font-size: 18.5px;
            line-height: 1.9;
            color: #1e293b;
            background-color: #ffffff;
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
            box-sizing: border-box;
            outline: none;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        /* 占位提示文字 */
        .book-page:empty::before {
            content: attr(placeholder);
            color: #94a3b8;
            cursor: text;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 顶部工具栏 -->
        <div class="toolbar" aria-hidden="true" role="none">
            <!-- 左侧：语言状态指示器 -->
            <div id="lang-indicator" class="lang-indicator">等待输入...</div>
            
            <!-- 右侧：按钮组 -->
            <div class="btn-group">
                <input type="file" id="txt-file-input" accept=".txt" style="display: none;" />
                <button class="btn-tool btn-import" onclick="triggerImport()">导入 TXT</button>
                <button class="btn-tool btn-clear" onclick="clearText()">清空文字</button>
            </div>
        </div>
        
        <div id="read-target" class="book-page" contenteditable="plaintext-only" placeholder="请在此粘贴中/英/日文字，或点击上方按钮导入 TXT 文件..." autofocus></div>
    </div>

    <script>
        const page = document.getElementById('read-target');
        const fileInput = document.getElementById('txt-file-input');
        const htmlRoot = document.getElementById('html-root');
        const langIndicator = document.getElementById('lang-indicator');
        const storageKey = 'reader_cached_text';

        // 核心：智能语言检测，并实时渲染状态灯和文字
        function autoDetectLanguage(text) {
            if (!text || text.trim() === "") {
                htmlRoot.setAttribute('lang', 'zh-CN');
                langIndicator.textContent = "等待输入...";
                langIndicator.className = "lang-indicator"; // 灰色
                return;
            }
            
            // 1. 优先检测日语（检测是否含有平假名或片假名）
            const hasJapaneseKana = /[\u3040-\u309F\u30A0-\u30FF]/.test(text);
            if (hasJapaneseKana) {
                htmlRoot.setAttribute('lang', 'ja-JP');
                langIndicator.textContent = "语言: 日本語 (ja-JP)";
                langIndicator.className = "lang-indicator lang-ja"; // 红色
                return;
            }

            // 2. 其次检测中文汉字
            const hasChinese = /[\u4e00-\u9fa5]/.test(text);
            if (hasChinese) {
                htmlRoot.setAttribute('lang', 'zh-CN');
                langIndicator.textContent = "语言: 中文 (zh-CN)";
                langIndicator.className = "lang-indicator lang-zh"; // 蓝色
                return;
            }

            // 3. 若皆无，默认判定为英文
            htmlRoot.setAttribute('lang', 'en-US');
            langIndicator.textContent = "语言: English (en-US)";
            langIndicator.className = "lang-indicator lang-en"; // 绿色
        }

        // 1. 初始化页面：载入缓存并检测语种
        window.addEventListener('DOMContentLoaded', function() {
            const cachedText = localStorage.getItem(storageKey);
            if (cachedText) {
                page.innerText = cachedText;
                autoDetectLanguage(cachedText);
            } else {
                autoDetectLanguage('');
            }
        });

        // 2. 实时保存并检测语种
        page.addEventListener('input', function() {
            const currentText = page.innerText;
            localStorage.setItem(storageKey, currentText);
            autoDetectLanguage(currentText);
        });

        // 3. 强制过滤粘贴格式
        page.addEventListener('paste', function(e) {
            e.preventDefault();
            const text = (e.clipboardData || window.clipboardData).getData('text/plain');
            
            if (document.queryCommandSupported('insertText')) {
                document.execCommand('insertText', false, text);
            } else {
                const selection = window.getSelection();
                if (!selection.rangeCount) return;
                selection.deleteFromDocument();
                selection.getRangeAt(0).insertNode(document.createTextNode(text));
            }
            
            const currentText = page.innerText;
            localStorage.setItem(storageKey, currentText);
            autoDetectLanguage(currentText);
        });

        // 4. 触发导入
        function triggerImport() {
            fileInput.click();
        }

        // 5. 监听文件选择并导入
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const textContent = evt.target.result;
                page.innerText = textContent;                  
                localStorage.setItem(storageKey, textContent); 
                autoDetectLanguage(textContent);               // 实时改变状态灯
                fileInput.value = '';                         
                page.focus();
            };
            
            reader.readAsText(file, 'UTF-8');
        });

        // 6. 一键清空页面及本地缓存
        function clearText() {
            page.innerHTML = '';
            localStorage.removeItem(storageKey);
            fileInput.value = '';
            autoDetectLanguage(''); // 重置状态灯为默认灰色
            page.focus();
        }
    </script>

</body>
</html>
