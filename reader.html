    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #f5f6f8;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 顶部工具栏 */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            -webkit-user-select: none;
            user-select: none;
            speak: none !important;
        }

        /* 极简状态指示器 */
        .lang-indicator {
            font-size: 13px;
            color: #64748b;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .lang-indicator::before {
            content: "";
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #94a3b8;
            transition: background-color 0.2s ease;
        }

        .lang-zh::before { background-color: #3b82f6 !important; } 
        .lang-ja::before { background-color: #ef4444 !important; } 
        .lang-en::before { background-color: #10b981 !important; } 

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .btn-tool {
            border: none;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 500;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-import {
            background-color: #e0f2fe;
            color: #0369a1;
        }
        .btn-import:active {
            background-color: #bae6fd;
        }

        .btn-clear {
            background-color: #e2e8f0;
            color: #475569;
        }
        .btn-clear:active {
            background-color: #cbd5e1;
        }

        /* 实体书页排版 */
        .book-page {
            width: 100%;
            min-height: 80vh;
            padding: 32px 24px;
            font-size: 18.5px;
            line-height: 1.9;
            color: #1e293b;
            background-color: #ffffff;
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
            box-sizing: border-box;
            outline: none;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .book-page:empty::before {
            content: attr(placeholder);
            color: #94a3b8;
            cursor: text;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="toolbar" aria-hidden="true" role="none">
            <div id="lang-indicator" class="lang-indicator">等待输入...</div>
            <div class="btn-group">
                <input type="file" id="txt-file-input" accept=".txt" style="display: none;" />
                <button class="btn-tool btn-import" onclick="triggerImport()">导入 TXT</button>
                <button class="btn-tool btn-clear" onclick="clearText()">清空文字</button>
            </div>
        </div>
        <div id="read-target" class="book-page" contenteditable="plaintext-only" placeholder="请在此粘贴文字，或点击上方按钮导入 TXT 文件..." autofocus></div>
    </div>

    <script>
        const page = document.getElementById('read-target');
        const fileInput = document.getElementById('txt-file-input');
        const htmlRoot = document.getElementById('html-root');
        const langIndicator = document.getElementById('lang-indicator');
        const storageKey = 'reader_cached_text';

        function autoDetectLanguage(text) {
            if (!text || text.trim() === "") {
                htmlRoot.setAttribute('lang', 'zh-CN');
                langIndicator.textContent = "等待输入...";
                langIndicator.className = "lang-indicator";
                return;
            }
            
            const hasJapaneseKana = /[\u3040-\u309F\u30A0-\u30FF]/.test(text);
            if (hasJapaneseKana) {
                htmlRoot.setAttribute('lang', 'ja-JP');
                langIndicator.textContent = "语言: 日本語 (ja-JP)";
                langIndicator.className = "lang-indicator lang-ja";
                return;
            }

            const hasChinese = /[\u4e00-\u9fa5]/.test(text);
            if (hasChinese) {
                htmlRoot.setAttribute('lang', 'zh-CN');
                langIndicator.textContent = "语言: 中文 (zh-CN)";
                langIndicator.className = "lang-indicator lang-zh";
                return;
            }

            htmlRoot.setAttribute('lang', 'en-US');
            langIndicator.textContent = "语言: English (en-US)";
            langIndicator.className = "lang-indicator lang-en";
        }

        window.addEventListener('DOMContentLoaded', function() {
            const cachedText = localStorage.getItem(storageKey);
            if (cachedText) {
                page.innerText = cachedText;
                autoDetectLanguage(cachedText);
            } else {
                autoDetectLanguage('');
            }
        });

        page.addEventListener('input', function() {
            const currentText = page.innerText;
            localStorage.setItem(storageKey, currentText);
            autoDetectLanguage(currentText);
        });

        page.addEventListener('paste', function(e) {
            e.preventDefault();
            const text = (e.clipboardData || window.clipboardData).getData('text/plain');
            
            if (document.queryCommandSupported('insertText')) {
                document.execCommand('insertText', false, text);
            } else {
                const selection = window.getSelection();
                if (!selection.rangeCount) return;
                selection.deleteFromDocument();
                selection.getRangeAt(0).insertNode(document.createTextNode(text));
            }
            
            const currentText = page.innerText;
            localStorage.setItem(storageKey, currentText);
            autoDetectLanguage(currentText);
        });

        function triggerImport() {
            fileInput.click();
        }

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const textContent = evt.target.result;
                page.innerText = textContent;                  
                localStorage.setItem(storageKey, textContent); 
                autoDetectLanguage(textContent);
                fileInput.value = '';                         
                page.focus();
            };
            
            reader.readAsText(file, 'UTF-8');
        });

        function clearText() {
            page.innerHTML = '';
            localStorage.removeItem(storageKey);
            fileInput.value = '';
            autoDetectLanguage('');
            page.focus();
        }
    </script>
</body>
</html>
