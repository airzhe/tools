    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #f5f6f8;
            color: #1e293b;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 顶部工具栏（对语音引擎隐形） */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            user-select: none;
            speak: none !important;
        }

        .lang-indicator {
            font-size: 13px;
            color: #64748b;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .lang-indicator::before {
            content: "";
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #94a3b8;
            transition: background-color 0.2s ease;
        }

        .lang-zh::before { background-color: #3b82f6 !important; } 
        .lang-ja::before { background-color: #ef4444 !important; } 
        .lang-en::before { background-color: #10b981 !important; } 

        .btn-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-tool {
            border: none;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: 500;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap; 
        }

        .btn-import {
            background-color: #e0f2fe;
            color: #0369a1;
        }
        .btn-import:active {
            background-color: #bae6fd;
        }

        .btn-search {
            background-color: #f0fdf4;
            color: #15803d;
        }
        .btn-search:active {
            background-color: #dcfce7;
        }

        .btn-clear {
            background-color: #e2e8f0;
            color: #475569;
        }
        .btn-clear:active {
            background-color: #cbd5e1;
        }

        /* 优雅的内置搜索栏（对语音引擎隐形） */
        .search-bar {
            display: flex;
            gap: 8px;
            background-color: #ffffff;
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            animation: slideDown 0.2s ease-out;
            speak: none !important;
        }

        .search-bar input {
            flex: 1;
            border: none;
            background: transparent;
            color: #1e293b;
            outline: none;
            font-size: 14px;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 悬浮返回顶部（对语音引擎隐形） */
        .btn-to-top {
            position: fixed;
            bottom: 32px;
            right: 24px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.95);
            color: #1e293b;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
            cursor: pointer;
            display: none; 
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            z-index: 999;
            transition: all 0.2s ease;
            user-select: none;
            speak: none !important;
        }
        .btn-to-top:active {
            transform: scale(0.9);
        }

        /* 历史段落折叠提示条（对语音引擎隐形） */
        .unfold-banner {
            background-color: #ffffff;
            color: #475569;
            opacity: 0.85;
            padding: 12px;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            border-radius: 12px;
            margin-bottom: 4px;
            cursor: pointer;
            border: 1px dashed #cbd5e1;
            box-sizing: border-box;
            user-select: none;
            speak: none !important;
        }

        /* 被折叠的已读段落 */
        .read-folded {
            display: none !important; 
        }

        /* 实体书页排版 */
        .book-page {
            width: 100%;
            min-height: 75vh;
            padding: 32px 24px;
            font-size: 18.5px;
            line-height: 2.0; 
            color: #1e293b;
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
            box-sizing: border-box;
            outline: none;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .book-page p {
            margin: 0 0 1.4em 0;
            text-indent: 2em;      
            line-height: 2.0;
            cursor: text;
        }

        .book-page:empty::before {
            content: attr(placeholder);
            color: #94a3b8;
            cursor: text;
        }

        /* 手机端自适应微调 */
        @media screen and (max-width: 768px) {
            body {
                padding: 12px;
            }

            .toolbar {
                padding: 4px 0; 
            }

            .btn-tool {
                font-size: 12px; 
                padding: 6px 12px;   
            }

            .book-page {
                padding: 24px 16px;     
                font-size: 17.5px;         
                border-radius: 12px;       
            }

            .btn-to-top {
                bottom: 24px;
                right: 16px; 
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 顶部主工具栏（对语音引擎隐藏） -->
        <div class="toolbar" aria-hidden="true" role="none" tabindex="-1">
            <div id="lang-indicator" class="lang-indicator">--</div>
            <div class="btn-group">
                <input type="file" id="txt-file-input" accept=".txt" style="display: none;" tabindex="-1" />
                <button class="btn-tool btn-import" onclick="triggerImport()" tabindex="-1">导入</button>
                <button class="btn-tool btn-search" onclick="toggleSearchBar()" tabindex="-1">搜索</button>
                <button class="btn-tool btn-clear" onclick="clearText()" tabindex="-1">清空</button>
            </div>
        </div>

        <!-- 内置搜索栏（对语音引擎隐藏） -->
        <div id="search-bar" class="search-bar" style="display: none;" aria-hidden="true" role="none" tabindex="-1">
            <input type="text" id="search-input" placeholder="输入已听过的字句定位段落..." onkeydown="handleSearchKeyDown(event)" tabindex="-1" />
            <button class="btn-tool btn-search" onclick="performSearch()" tabindex="-1">定位</button>
        </div>
        
        <!-- 文章容器 -->
        <div id="read-target" class="book-page" contenteditable="plaintext-only" role="main" aria-label="小说正文" placeholder="请在此粘贴文字，或点击上方按钮导入 TXT 文件..." autofocus></div>
    </div>

    <!-- 悬浮返回顶部按钮（对语音引擎隐藏） -->
    <button id="btn-to-top" class="btn-to-top" onclick="scrollToTop()" title="返回顶部" aria-hidden="true" role="none" tabindex="-1">↑</button>

    <script>
        const page = document.getElementById('read-target');
        const fileInput = document.getElementById('txt-file-input');
        const htmlRoot = document.getElementById('html-root');
        const langIndicator = document.getElementById('lang-indicator');
        const toTopBtn = document.getElementById('btn-to-top');
        const searchBar = document.getElementById('search-bar');
        const searchInput = document.getElementById('search-input');
        
        const storageKey = 'reader_cached_text';
        const paragraphKey = 'reader_cached_paragraph'; 

        let observer = null;

        // 听书文本净化器：自动过滤掉连续 3 个以上的排版装饰符号，避免引擎生硬读出
        function sanitizeTextForTTS(text) {
            return text
                .replace(/[-*#=_~+◆★▲●▼■]{3,}/g, '') 
                .replace(/\s+/g, ' '); 
        }

        // 格式化段落（过滤空行 & 净化文本）
        function formatTextToParagraphs(text) {
            if (!text || text.trim() === "") {
                page.innerHTML = '';
                return;
            }
            const lines = text.split(/\r?\n/)
                .map(line => sanitizeTextForTTS(line.trim()))
                .filter(line => line.length > 0);

            page.innerHTML = lines.map(line => `<p>${line}</p>`).join('');
            
            // 重建进度监听
            initObserver();
        }

        // 语言自动检测
        function autoDetectLanguage(text) {
            if (!text || text.trim() === "") {
                htmlRoot.setAttribute('lang', 'zh-CN');
                langIndicator.textContent = "--";
                langIndicator.className = "lang-indicator";
                return;
            }
            
            const hasJapaneseKana = /[\u3040-\u309F\u30A0-\u30FF]/.test(text);
            if (hasJapaneseKana) {
                htmlRoot.setAttribute('lang', 'ja-JP');
                langIndicator.textContent = "JA";
                langIndicator.className = "lang-indicator lang-ja";
                return;
            }

            const hasChinese = /[\u4e00-\u9fa5]/.test(text);
            if (hasChinese) {
                htmlRoot.setAttribute('lang', 'zh-CN');
                langIndicator.textContent = "ZH";
                langIndicator.className = "lang-indicator lang-zh";
                return;
            }

            htmlRoot.setAttribute('lang', 'en-US');
            langIndicator.textContent = "EN";
            langIndicator.className = "lang-indicator lang-en";
        }

        // 实时阅读进度监听（静默记录）
        function initObserver() {
            if (observer) observer.disconnect();

            observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const paragraphs = Array.from(page.querySelectorAll('p'));
                        const index = paragraphs.indexOf(entry.target);
                        if (index !== -1 && !entry.target.classList.contains('read-folded')) {
                            localStorage.setItem(paragraphKey, index);
                        }
                    }
                });
            }, {
                root: null,
                rootMargin: "-10% 0px -75% 0px" // 当段落进入屏幕焦点区域时触发
            });

            const paragraphs = page.querySelectorAll('p');
            paragraphs.forEach(p => observer.observe(p));
        }

        // 恢复阅读进度
        function restoreReadingProgress() {
            const existingBanner = document.getElementById('unfold-banner');
            if (existingBanner) existingBanner.remove();

            const savedIndexStr = localStorage.getItem(paragraphKey);
            const paragraphs = page.querySelectorAll('p');
            
            if (savedIndexStr && paragraphs.length > 0) {
                const savedIndex = parseInt(savedIndexStr);
                
                if (savedIndex > 0 && savedIndex < paragraphs.length) {
                    const banner = document.createElement('div');
                    banner.id = 'unfold-banner';
                    banner.className = 'unfold-banner';
                    banner.setAttribute('aria-hidden', 'true');
                    banner.setAttribute('role', 'none');
                    banner.setAttribute('tabindex', '-1');
                    banner.textContent = `已自动折叠上方 ${savedIndex} 个已读段落，点击展开...`;
                    banner.onclick = unfoldAllParagraphs;

                    const container = document.querySelector('.container');
                    container.insertBefore(banner, page);

                    for (let i = 0; i < savedIndex; i++) {
                        paragraphs[i].classList.add('read-folded');
                    }

                    const targetP = paragraphs[savedIndex];
                    setTimeout(() => {
                        targetP.scrollIntoView({ block: 'start', behavior: 'instant' });
                        window.scrollTo(0, 0); 
                    }, 100);
                }
            }
        }

        // 重置进度
        function resetProgress() {
            localStorage.setItem(paragraphKey, 0);
            silentResetFolding();
        }

        // 监听页面滚动，显示或隐藏返回顶部按钮
        window.addEventListener('scroll', function() {
            if (window.scrollY > 400) {
                toTopBtn.style.display = 'flex';
            } else {
                toTopBtn.style.display = 'none';
            }
        });

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function silentResetFolding() {
            const paragraphs = page.querySelectorAll('p');
            paragraphs.forEach(p => p.classList.remove('read-folded'));
            
            const banner = document.getElementById('unfold-banner');
            if (banner) banner.remove();
        }

        function unfoldAllParagraphs() {
            silentResetFolding();
            
            const savedIndexStr = localStorage.getItem(paragraphKey);
            const paragraphs = page.querySelectorAll('p');
            if (savedIndexStr && paragraphs[parseInt(savedIndexStr)]) {
                const targetP = paragraphs[parseInt(savedIndexStr)];
                targetP.scrollIntoView({ block: 'start', behavior: 'instant' });
                window.scrollBy(0, -50);
            }
        }

        // 轻点任意段落手动设置进度起点
        page.addEventListener('click', function(e) {
            if (e.target.tagName.toLowerCase() === 'p') {
                const paragraphs = Array.from(page.querySelectorAll('p'));
                const index = paragraphs.indexOf(e.target);
                if (index !== -1) {
                    localStorage.setItem(paragraphKey, index);
                }
            }
        });

        // 搜索面板控制
        function toggleSearchBar() {
            if (searchBar.style.display === 'none') {
                searchBar.style.display = 'flex';
                searchInput.focus();
            } else {
                searchBar.style.display = 'none';
            }
        }

        function handleSearchKeyDown(e) {
            if (e.key === 'Enter') {
                performSearch();
            }
        }

        function performSearch() {
            const query = searchInput.value;
            if (!query || query.trim() === "") return;

            const paragraphs = page.querySelectorAll('p');
            let foundIndex = -1;

            for (let i = 0; i < paragraphs.length; i++) {
                if (paragraphs[i].textContent.includes(query.trim())) {
                    foundIndex = i;
                    break; 
                }
            }

            if (foundIndex !== -1) {
                silentResetFolding();
                localStorage.setItem(paragraphKey, foundIndex);
                restoreReadingProgress();
                toggleSearchBar();
            } else {
                alert("未在正文中找到包含该字句的段落。");
            }
        }

        // 粘贴文本
        page.addEventListener('paste', function(e) {
            e.preventDefault();
            const text = (e.clipboardData || window.clipboardData).getData('text/plain');
            
            if (document.queryCommandSupported('insertText')) {
                document.execCommand('insertText', false, text);
            } else {
                const selection = window.getSelection();
                if (!selection.rangeCount) return;
                selection.deleteFromDocument();
                selection.getRangeAt(0).insertNode(document.createTextNode(text));
            }
            
            const rawText = page.innerText;
            resetProgress(); 
            formatTextToParagraphs(rawText);
            localStorage.setItem(storageKey, rawText);
            autoDetectLanguage(rawText);
        });

        // 文本输入
        page.addEventListener('input', function() {
            const rawText = page.innerText;
            localStorage.setItem(storageKey, rawText);
            autoDetectLanguage(rawText);
        });

        // 导入 TXT（支持编码自动检测）
        function triggerImport() {
            fileInput.click();
        }

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const buffer = evt.target.result;
                const uint8 = new Uint8Array(buffer);
                
                let isUtf8 = true;
                let i = 0;
                while (i < uint8.length) {
                    if (uint8[i] <= 0x7F) { i++; }
                    else if (uint8[i] >= 0xC2 && uint8[i] <= 0xDF && i + 1 < uint8.length && (uint8[i+1] & 0xC0) === 0x80) { i += 2; }
                    else if (uint8[i] >= 0xE0 && uint8[i] <= 0xEF && i + 2 < uint8.length && (uint8[i+1] & 0xC0) === 0x80 && (uint8[i+2] & 0xC0) === 0x80) { i += 3; }
                    else { isUtf8 = false; break; }
                }

                const encoding = isUtf8 ? 'utf-8' : 'gbk';
                const decoder = new TextDecoder(encoding);
                const textContent = decoder.decode(uint8);

                resetProgress(); 
                formatTextToParagraphs(textContent);               
                localStorage.setItem(storageKey, textContent); 
                autoDetectLanguage(textContent);
                fileInput.value = '';                         
                page.focus();
            };
            
            reader.readAsArrayBuffer(file);
        });

        // 清空
        function clearText() {
            if (confirm("确定要清空所有文本和听书进度吗？")) {
                page.innerHTML = '';
                localStorage.removeItem(storageKey);
                localStorage.removeItem(paragraphKey);
                fileInput.value = '';
                autoDetectLanguage('');
                silentResetFolding();
                page.focus();
            }
        }

        // 初始化
        window.addEventListener('DOMContentLoaded', function() {
            const cachedRawText = localStorage.getItem(storageKey);
            if (cachedRawText) {
                formatTextToParagraphs(cachedRawText);
                autoDetectLanguage(cachedRawText);
                restoreReadingProgress(); 
            } else {
                autoDetectLanguage('');
            }
        });
    </script>
</body>
</html>
